<html><head><title>Lazy gallery</title></head><body>
<article>
<h1>Gallery</h1>
<p>A page of lazy-loaded photographs, each with the same placeholder image in src and the real address in a data attribute. This paragraph gives the article enough text to count as main content for the extractor.</p>
<img class="lazyload" alt="One" data-src="https://site.example/wp-content/uploads/2026/02/one.jpg" src="data:image/svg+xml;base64,PHN2Zy8+">
<img class="lazyload" alt="Two" data-src="/wp-content/uploads/2026/02/two.jpg" src="data:image/svg+xml;base64,PHN2Zy8+">
<img class="lazyload" alt="Three" data-srcset="https://site.example/wp-content/uploads/2026/02/three-400.jpg 400w, https://site.example/wp-content/uploads/2026/02/three-1200.jpg 1200w, https://site.example/wp-content/uploads/2026/02/three-800.jpg 800w" src="data:image/svg+xml;base64,PHN2Zy8+">
<img class="lazyload" alt="Four" data-lazy-src="https://site.example/wp-content/uploads/2026/02/four.jpg" src="data:image/svg+xml;base64,PHN2Zy8+">
<img alt="Normal" src="https://site.example/wp-content/uploads/2026/02/normal.jpg" data-src="https://site.example/other.jpg">
</article>
</body></html>
